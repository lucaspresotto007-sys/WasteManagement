version: '3.8'

# =============================================================================
# Waste Management ESG API — Base Docker Compose
# Used directly for local development.
# For staging:    docker compose -f docker-compose.staging.yml up
# For production: docker compose -f docker-compose.prod.yml up
# =============================================================================

networks:
  esg_network:
    driver: bridge

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_esg
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - esg_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  webapi:
    image: wastemanagementapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wastemanagement_api
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME:-WasteManagementDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-WasteManagementAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-WasteManagementAPI}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - esg_network
    restart: on-failure

volumes:
  sqlserver_data:
    driver: local
